name: Build Native Prebuilds

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-prebuilds:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 仅支持 ARM64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
          # Windows x64 (兼容 Win10 / Win11 x64)
          - os: windows-2022
            arch: x64
          # Windows ARM64 交叉编译 (兼容 Win10 / Win11 ARM64)
          - os: windows-2022
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 在 Windows 上设置 MSVC 环境，并根据 matrix.arch 指定目标架构 (x64 / arm64)
      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # 禁用生命周期 install 脚本，防止 npm install 自动触发本地编译
      - name: Install Dependencies
        run: npm install --ignore-scripts

      # 构建原生预编译包，传递目标架构环境变量
      - name: Build Prebuild Binary
        run: npx prebuildify --napi --target 20.0.0 --arch ${{ matrix.arch }} --strip
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
          npm_config_arch: ${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}

      - name: Upload Prebuild Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ runner.os }}-${{ matrix.arch }}
          path: prebuilds/

  commit-prebuilds:
    name: Commit Prebuilds back to Git
    needs: build-prebuilds
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 GitHub Actions 向仓库提交代码的权限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp-artifacts

      - name: Organize prebuilds
        run: |
          mkdir -p prebuilds
          # 递归将各平台 artifact 的子目录合并，防止文件名重名覆盖
          cp -R temp-artifacts/*/* prebuilds/ 2>/dev/null || cp -R temp-artifacts/* prebuilds/
          rm -rf temp-artifacts
          echo "=== Final prebuilds directory structure ==="
          ls -R prebuilds

      - name: Commit and push prebuilds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update prebuild binaries [skip ci]"
          file_pattern: "prebuilds/*"