name: Build Native Prebuilds

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-prebuilds:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 仅支持 ARM64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
          # Windows 支持 x64
          - os: windows-latest
            arch: x64
          # Windows 支持 ARM64 (通过 x64 机器交叉编译)
          - os: windows-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 仅在 Windows 上设置 MSVC 编译环境，跳过 node-gyp 查找 VS 的自动探测过程
      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # 禁用生命周期 install 脚本，防止 npm install 自动触发本地编译
      - name: Install Dependencies
        run: npm install --ignore-scripts

      # 构建原生预编译包，指定 --target 20.0.0 确保构建符合 Node 20 标头的 ABI
      - name: Build Prebuild Binary
        run: npx prebuildify --napi --target 20.0.0 --arch ${{ matrix.arch }} --strip

      - name: Upload Prebuild Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ runner.os }}-${{ matrix.arch }}
          path: prebuilds/

  commit-prebuilds:
    name: Commit Prebuilds back to Git
    needs: build-prebuilds
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 GitHub Actions 向仓库提交代码的权限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp-artifacts

      - name: Organize prebuilds
        run: |
          mkdir -p prebuilds
          # 将下载下来的各个平台产物递归复制到 prebuilds 目录
          find temp-artifacts -type f -name "*.node" -exec cp {} prebuilds/ \;
          rm -rf temp-artifacts
          ls -R prebuilds

      - name: Commit and push prebuilds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update prebuild binaries [skip ci]"
          file_pattern: "prebuilds/*"