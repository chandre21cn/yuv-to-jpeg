name: Build Native Prebuilds

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-prebuilds:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 仅支持 ARM64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
          # Windows x64 (使用稳定的 windows-2022 镜像)
          - os: windows-2022
            arch: x64
          # Windows ARM64 交叉编译 (使用稳定的 windows-2022 镜像)
          - os: windows-2022
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 设置 MSVC 2022 环境，确保命令行与环境变量对齐
      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.38' # 对应 VS 2022 C++ 工具链

      # 禁用生命周期 install 脚本，防止 npm install 自动触发编译
      - name: Install Dependencies
        run: npm install --ignore-scripts

      # 显式配置 GYP_MSVS_VERSION=2022 强制跳过自动探测
      - name: Build Prebuild Binary
        run: npx prebuildify --napi --target 20.0.0 --arch ${{ matrix.arch }} --strip
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'

      - name: Upload Prebuild Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ runner.os }}-${{ matrix.arch }}
          path: prebuilds/

  commit-prebuilds:
    name: Commit Prebuilds back to Git
    needs: build-prebuilds
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 GitHub Actions 向仓库提交代码的权限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp-artifacts

      - name: Organize prebuilds
        run: |
          mkdir -p prebuilds
          # 将下载下来的各个平台产物递归复制到 prebuilds 目录
          find temp-artifacts -type f -name "*.node" -exec cp {} prebuilds/ \;
          rm -rf temp-artifacts
          ls -R prebuilds

      - name: Commit and push prebuilds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update prebuild binaries [skip ci]"
          file_pattern: "prebuilds/*"