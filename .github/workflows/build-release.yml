name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            node-arch: arm64
            cross-arch: ''
          - os: windows-latest
            platform: win32
            arch: x64
            node-arch: x64
            cross-arch: ''
          - os: windows-latest
            platform: win32
            arch: arm64
            node-arch: x64
            cross-arch: 'arm64'

    env:
      npm_config_arch: ${{ matrix.cross-arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node-arch }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Build native binary
        shell: bash
        run: |
          if [ -n "$npm_config_arch" ]; then
            echo "Cross-compiling for $npm_config_arch"
          fi
          npm run build 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            cat build_output.log
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}-${{ matrix.arch }}
          path: build_output.log
          if-no-files-found: ignore

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/yuv2jpeg_worker.node dist/yuv_to_jpeg-${{ matrix.platform }}-${{ matrix.arch }}.node
          ls -lh dist/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuv_to_jpeg-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten binaries
        run: |
          mkdir -p release
          find dist -name "*.node" -exec cp {} release/ \;
          ls -lh release/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.node
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
