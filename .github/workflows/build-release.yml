name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            node-arch: arm64
          - os: macos-13
            arch: x64
            node-arch: x64
          - os: windows-latest
            arch: x64
            node-arch: x64
          - os: ubuntu-latest
            arch: x64
            node-arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.node-arch }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm cmake build-essential python3

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Build native binary
        shell: bash
        run: |
          npm run build 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            cat build_output.log
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ runner.os }}-${{ matrix.arch }}
          path: build_output.log
          if-no-files-found: ignore

      - name: Locate binary (Unix)
        if: runner.os != 'Windows'
        run: ls -lh build/Release/*.node

      - name: Locate binary (Windows)
        if: runner.os == 'Windows'
        run: dir build\Release\*.node

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/Release/yuv2jpeg_worker.node dist/yuv_to_jpeg-${{ runner.os == 'macOS' && 'darwin' || runner.os == 'Linux' && 'linux' }}-${{ matrix.arch }}.node

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/yuv2jpeg_worker.node dist/yuv_to_jpeg-win32-${{ matrix.arch }}.node

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuv_to_jpeg-${{ runner.os == 'macOS' && 'darwin' || runner.os == 'Linux' && 'linux' || 'win32' }}-${{ matrix.arch }}
          path: dist/

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten binaries
        run: |
          mkdir -p release
          find dist -name "*.node" -exec cp {} release/ \;
          ls -lh release/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.node
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
